<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#244b3a"><title>Actualizar Descubre A Lamosa</title><style>body{margin:0;min-height:100vh;display:grid;place-items:center;background:#f3f0e8;font-family:system-ui;color:#17231d}.box{max-width:420px;margin:20px;background:white;border-radius:18px;padding:24px;box-shadow:0 12px 40px #0002;text-align:center}.spin{width:34px;height:34px;border:4px solid #d9ddd8;border-top-color:#244b3a;border-radius:50%;margin:18px auto;animation:s .8s linear infinite}@keyframes s{to{transform:rotate(360deg)}}</style></head><body><div class="box"><h1>Actualizando Descubre A Lamosa</h1><div class="spin"></div><p id="status">Limpiando la versión anterior…</p><small>Los favoritos y datos de Campo permanecen guardados.</small></div><script>(async()=>{try{if('serviceWorker'in navigator){const rs=await navigator.serviceWorker.getRegistrations();await Promise.all(rs.map(r=>r.unregister()));}if('caches'in window){const ks=await caches.keys();await Promise.all(ks.filter(k=>k.startsWith('a-lamosa-')).map(k=>caches.delete(k)));}document.getElementById('status').textContent='Lista. Abriendo…';setTimeout(()=>location.replace('./?v=121b1&fresh=1'),700);}catch(e){location.replace('./?v=121b1');}})();</script></body></html>
