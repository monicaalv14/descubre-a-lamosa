<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#244b3a"><title>Actualizar Descubre A Lamosa</title><style>body{margin:0;font-family:system-ui,sans-serif;background:#f4f1e9;color:#17231d;display:grid;place-items:center;min-height:100vh}main{max-width:520px;padding:28px;text-align:center}h1{color:#244b3a}#state{margin:18px 0;padding:14px;border-radius:12px;background:white}button{border:0;border-radius:999px;background:#244b3a;color:white;padding:13px 20px;font-size:16px}</style></head><body><main><h1>Descubre A Lamosa</h1><p>Preparando la versión 0.9.0…</p><div id="state">Limpiando versiones anteriores.</div><button id="go" hidden>Abrir v0.9.0</button></main><script>(async()=>{const s=document.getElementById('state'),g=document.getElementById('go');try{if('serviceWorker'in navigator){const rs=await navigator.serviceWorker.getRegistrations();await Promise.all(rs.map(r=>r.unregister()));}if('caches'in window){const ks=await caches.keys();await Promise.all(ks.map(k=>caches.delete(k)));}s.textContent='Actualización preparada. Abriendo v0.9.0…';g.hidden=false;g.onclick=()=>location.replace('./?v=090&fresh='+Date.now());setTimeout(()=>g.click(),800);}catch(e){s.textContent='Pulsa para abrir la versión nueva.';g.hidden=false;g.onclick=()=>location.replace('./?v=090&fresh='+Date.now());}})();</script></body></html>
