<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#244b3a">
<title>Actualizar Descubre A Lamosa</title>
<style>
body{margin:0;font-family:system-ui,sans-serif;background:#f4f1e9;color:#17231d;display:grid;place-items:center;min-height:100vh}
main{max-width:520px;padding:28px;text-align:center}
h1{color:#244b3a}#state{margin:18px 0;padding:14px;border-radius:12px;background:white}
button{border:0;border-radius:999px;background:#244b3a;color:white;padding:13px 20px;font-size:16px}
</style>
</head>
<body><main>
<h1>Descubre A Lamosa</h1>
<p>Preparando la versión nueva…</p>
<div id="state">Limpiando la versión anterior.</div>
<button id="go" hidden>Abrir v0.7.2</button>
</main>
<script>
(async()=>{
 const state=document.getElementById('state'),go=document.getElementById('go');
 try{
   if('serviceWorker' in navigator){
     const regs=await navigator.serviceWorker.getRegistrations();
     await Promise.all(regs.map(r=>r.unregister()));
   }
   if('caches' in window){
     const keys=await caches.keys();
     await Promise.all(keys.map(k=>caches.delete(k)));
   }
   state.textContent='Actualización preparada. Abriendo v0.7.2…';
   go.hidden=false;
   go.onclick=()=>location.replace('./?v=072&fresh='+Date.now());
   setTimeout(()=>go.click(),900);
 }catch(e){
   state.textContent='Pulsa el botón para abrir la versión nueva.';
   go.hidden=false;
   go.onclick=()=>location.replace('./?v=072&fresh='+Date.now());
 }
})();
</script></body></html>
