<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#244b3a"><title>Actualizar Descubre A Lamosa</title><style>body{margin:0;min-height:100vh;display:grid;place-items:center;background:#f4f1e9;font-family:system-ui;color:#17231d}.box{max-width:420px;margin:20px;background:white;border-radius:18px;padding:24px;box-shadow:0 12px 40px #0002;text-align:center}h1{font-size:22px}.spin{width:34px;height:34px;border:4px solid #d9ddd8;border-top-color:#244b3a;border-radius:50%;margin:18px auto;animation:s .8s linear infinite}@keyframes s{to{transform:rotate(360deg)}}a{display:inline-block;margin-top:12px;padding:10px 14px;background:#244b3a;color:#fff;border-radius:10px;text-decoration:none;font-weight:700}</style></head><body><div class="box"><h1>Actualizando a v0.10.0</h1><div class="spin"></div><p id="status">Limpiando la versión anterior…</p><p><small>Tus favoritos y datos de Campo no se borran.</small></p><a id="manual" href="./?v=100" hidden>Abrir la aplicación</a></div><script>(async()=>{const s=document.getElementById('status'),a=document.getElementById('manual');try{if('serviceWorker'in navigator){const rs=await navigator.serviceWorker.getRegistrations();await Promise.all(rs.map(r=>r.unregister()));}if('caches'in window){const ks=await caches.keys();await Promise.all(ks.filter(k=>k.startsWith('a-lamosa-')).map(k=>caches.delete(k)));}s.textContent='Actualización preparada. Abriendo…';setTimeout(()=>location.replace('./?v=100&fresh=1'),700);}catch(e){s.textContent='Pulsa para abrir la nueva versión.';a.hidden=false;}})();</script></body></html>
