name: Generar piloto audioguia Ponte Folon

on:
  workflow_dispatch:

jobs:
  narracion:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Instalar Kokoro
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq espeak-ng
          python -m pip install --upgrade pip
          pip install "kokoro>=0.9.4" soundfile
      - name: Generar narracion
        run: |
          mkdir -p audio
          cat > /tmp/narrar.py <<'PY'
          from kokoro import KPipeline
          import numpy as np
          import soundfile as sf

          texto = """Estás junto a Ponte Folón, uno de los elementos destacados de la Ruta do Xabriña. Este puente de piedra forma parte de un paisaje marcado por el río, los caminos y el paso de quienes recorrieron este territorio. La documentación municipal lo relaciona con un camino histórico, y hoy la ruta P R G ciento diecinueve nos permite acercarnos de nuevo a este lugar. Antes de continuar, detente un momento. Observa la piedra, escucha el agua y mira cómo el camino se integra en el paisaje. En lugares como este, la historia de A Lamosa no se encuentra solamente en los documentos. También permanece en los caminos."""
          pipe=KPipeline(lang_code='e')
          partes=[]
          for _,_,audio in pipe(texto,voice='em_santa',speed=0.88):
              if audio is not None:
                  partes.append(audio.numpy() if hasattr(audio,'numpy') else np.asarray(audio))
          if not partes:
              raise RuntimeError('Kokoro no devolvio audio')
          sf.write('audio/ponte-folon-santa.wav',np.concatenate(partes),24000)
          PY
          python /tmp/narrar.py
      - name: Guardar piloto
        uses: actions/upload-artifact@v4
        with:
          name: piloto-ponte-folon-santa
          path: audio/ponte-folon-santa.wav
          retention-days: 14
