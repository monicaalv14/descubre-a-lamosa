name: Integrar audioguia Santa 0.76

permissions:
  actions: read
  contents: write

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/audioguide-produccion.yml'

jobs:
  integrar:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Descargar artefacto Santa 0.76 ya generado
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p audio/es /tmp/santa076
          gh api repos/${{ github.repository }}/actions/artifacts/11133390974/zip > /tmp/santa076.zip
          unzip -o /tmp/santa076.zip -d /tmp/santa076
          cp /tmp/santa076/*.wav audio/es/
          cp /tmp/santa076/manifest.json audio/es/manifest.json
          test "$(find audio/es -maxdepth 1 -name '*.wav' | wc -l)" -eq 16
      - name: Asignar audio_es y cache offline
        run: |
          python - <<'PY'
          import json, glob, pathlib, re
          manifest=json.load(open('audio/es/manifest.json',encoding='utf-8'))
          assert len(manifest)==16
          audio={x['id']:x['audio_es'] for x in manifest}
          found=set()
          for fn in sorted(glob.glob('data/pois-*.json')):
              with open(fn,encoding='utf-8') as f: data=json.load(f)
              changed=False
              for p in data:
                  if p.get('id') in audio:
                      p['audio_es']=audio[p['id']]
                      found.add(p['id']); changed=True
              if changed:
                  with open(fn,'w',encoding='utf-8') as f:
                      json.dump(data,f,ensure_ascii=False,indent=2); f.write('\n')
          assert found==set(audio), (set(audio)-found)
          sw=pathlib.Path('sw.js'); s=sw.read_text(encoding='utf-8')
          audios=["./"+x['audio_es'] for x in manifest]
          marker="  './icons/icon-192.png','./icons/icon-512.png'"
          block="  "+",".join(repr(x) for x in audios)+",\n"
          if audios[0] not in s: s=s.replace(marker,block+marker)
          s=re.sub(r"a-lamosa-shell-v[0-9A-Za-z.-]+","a-lamosa-shell-v128-audio",s)
          s=re.sub(r"a-lamosa-runtime-v[0-9A-Za-z.-]+","a-lamosa-runtime-v128-audio",s)
          sw.write_text(s,encoding='utf-8')
          PY
      - name: Publicar audioguia integrada
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add audio/es data/pois-*.json sw.js
          git commit -m "audio: integrar audioguia Santa 0.76 offline"
          git push
